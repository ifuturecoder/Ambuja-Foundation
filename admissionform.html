<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(rgba(8,31,61,0.78),rgba(8,31,61,0.78)),url("ACF.jpg") center/cover fixed;
    color:#1d1d1d;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    padding:30px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.form-card{
    width:100%;
    max-width:920px;
    background:#ffffff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 18px 45px rgba(0,0,0,0.35);
}

.form-header{
    background:#0b2343;
    color:white;
    padding:28px;
    text-align:center;
    border-bottom:6px solid #f4c542;
}

.form-header img{
    width:120px;
    max-width:45%;
    height:auto;
    margin-bottom:12px;
}

.form-header h1{
    font-size:32px;
    margin-bottom:8px;
}

.form-header p{
    font-size:17px;
    color:#f3f3f3;
}

form{
    padding:30px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.form-group{
    text-align:left;
}

.full-width{
    grid-column:1 / -1;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:16px;
    font-weight:bold;
    color:#0b2343;
}

input,
select,
textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid #cccccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
    background:#fbfbfb;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#f4c542;
    box-shadow:0 0 0 3px rgba(244,197,66,0.25);
    background:white;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.captcha-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px;
    background:#f5f5f5;
    border:1px solid #dddddd;
    border-radius:8px;
}

.captcha-row input{
    width:18px;
    height:18px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:26px;
}

button{
    min-width:130px;
    border:none;
    padding:13px 22px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn{
    background:#c94c1a;
    color:white;
}

.reset-btn{
    background:#0b2343;
    color:white;
}

button:hover{
    transform:translateY(-3px);
    transition:0.3s;
    box-shadow:0 8px 16px rgba(0,0,0,0.22);
}

.back-link{
    display:inline-block;
    margin-top:18px;
    color:#f4c542;
    text-decoration:none;
    font-weight:bold;
}

.back-link:hover{
    color:white;
}

@media(max-width:768px){
    body{
        background-attachment:scroll;
    }

    .page{
        padding:18px 12px;
    }

    .form-header{
        padding:24px 18px;
    }

    .form-header h1{
        font-size:25px;
    }

    .form-header p{
        font-size:15px;
    }

    form{
        padding:22px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:16px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}

@media(max-width:480px){
    .form-card{
        border-radius:10px;
    }

    .form-header img{
        width:95px;
    }

    .form-header h1{
        font-size:22px;
    }

    form{
        padding:18px;
    }

    input,
    select,
    textarea{
        font-size:15px;
        padding:12px;
    }
}
</style>
</head>

<body>
<main class="page">
    <div class="form-card">
        <div class="form-header">
            <img src="Ambuja Foundation SEDI.png" alt="Ambuja Foundation SEDI">
            <h1>Admission Enquiry Form</h1>
            <p>Fill your details and choose the course you want to apply for.</p>
            <a class="back-link" href="assignment.html">Back to Home</a>
        </div>

        <form>
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input id="name" type="text" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email ID *</label>
                    <input id="email" type="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Mobile Number *</label>
                    <input id="phone" type="tel" placeholder="Enter mobile number" required>
                </div>

                <div class="form-group">
                    <label for="course">Course Applied For *</label>
                    <select id="course" required>
                        <option value="">Select course</option>
                        <option>Electrician</option>
                        <option>COPA</option>
                        <option>Mechanic Motor Vehicle</option>
                        <option>Electronics Mechanic</option>
                        <option>Accounts Executive - Tally</option>
                        <option>General Duty Assistant</option>
                        <option>Sewing Machine Operator</option>
                        <option>Soft Skills</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="">Select gender</option>
                        <option>Female</option>
                        <option>Male</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">Select category</option>
                        <option>General</option>
                        <option>ST</option>
                        <option>SC</option>
                        <option>EWS</option>
                        <option>Others</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <textarea id="address" placeholder="Enter your address or message"></textarea>
                </div>

                <div class="form-group full-width">
                    <label class="captcha-row">
                        <input type="checkbox" required>
                        <span>I'm not a robot *</span>
                    </label>
                </div>
            </div>

            <div class="buttons">
                <button class="submit-btn" type="submit">Submit</button>
                <button class="reset-btn" type="reset">Reset</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
